<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Layanan</title>
    <!-- Script Resmi Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #18222d;
            color: #ffffff;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        /* Desain Dasar Tombol */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        /* Background Warna Murni */
        .btn-green { background-color: #28a745; } /* Hijau Murni */
        .btn-blue  { background-color: #007bff; } /* Biru Murni */
        .btn-orange{ background-color: #fd7e14; } /* Oranye Murni */
        .btn-red   { background-color: #dc3545; } /* Merah Murni */
    </style>
</head>
<body>

    <div class="header">📱 PILIH LAYANAN</div>

    <!-- Tombol-tombol Berwarna Murni -->
    <button class="btn btn-green" onclick="pilihLayanan('Togo - WhatsApp')">
        🟢 Togo [WhatsApp] - Rp 3.500
    </button>

    <button class="btn btn-blue" onclick="pilihLayanan('Tajikistan - Telegram')">
        🔵 Tajikistan [Telegram] - Rp 4.000
    </button>

    <button class="btn btn-orange" onclick="pilihLayanan('Indonesia - Gojek')">
        🟠 Indonesia [Gojek] - Rp 2.500
    </button>

    <button class="btn btn-red" onclick="tutupApp()">
        🔴 Batal / Tutup
    </button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Buka jendela Mini App penuh di layar HP

        function pilihLayanan(namaLayanan) {
            // Mengirim data pilihan kembali ke chat Telegram
            tg.sendData(namaLayanan);
            tg.close();
        }

        function tutupApp() {
            tg.close();
        }
    </script>
</body>
</html>
